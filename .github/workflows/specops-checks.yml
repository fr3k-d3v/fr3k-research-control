name: SpecOps offline checks
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['specops/**', '.github/workflows/specops-checks.yml']
  pull_request:
    paths: ['specops/**', '.github/workflows/specops-checks.yml']
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Standard-library unit suites
        run: |
          set -eu
          for module in contract fleet_observe converge fleet_transport journal; do
            python -I -B "specops/$module.py"
          done
